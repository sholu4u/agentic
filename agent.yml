agents:
  - id: logs
    name: Logs agent
    description: >
      Inspects, summarizes, and sanitizes log files. Never overwrites sources;
      applies PII rules before sharing or committing.
    skills:
      - pii-sanitizer
    next_agents:
      - reviewer   # after sanitizing logs, pass to reviewer agent

  - id: reviewer
    name: Code Review agent
    description: >
      Reviews git commits for PII, credentials, vulnerabilities, and common issues.
      Runs sanitizer first to redact sensitive data, then regex checks, then calls
      an LLM for deeper vulnerability and optimization review.
    skills:
      - git-code-review
      - llm-code-review
    config:
      llm_provider: openai   # or "openai"
      model: gpt-4-turbo
